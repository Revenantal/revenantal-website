# revenantal.com on Coolify: paste this into a "Docker Compose Empty" resource.
# GitHub Actions builds and publishes every image; Coolify only pulls and runs them.
# Settings marked ${...} appear in Coolify's Environment Variables; see deploy/README.md.
# All services share Coolify's network for this resource; only `site` gets a domain.
# pull_policy: always makes each deploy fetch the new `latest`; Coolify otherwise reuses the
# copy it already has.
services:
  # The site and its Caddy. Give this service the domains, on internal port 8080.
  site:
    image: ghcr.io/revenantal/revenantal-site:${SITE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose: ["8080"]
    environment:
      # Coolify's proxy address, the only peer allowed to name the visitor (set in task 3.7).
      TRUSTED_EDGE: ${TRUSTED_EDGE:-192.0.2.1/32}
      # Weather stays off (an uncached 503) until this is set to forecast:8090.
      FORECAST_UPSTREAM: ${FORECAST_UPSTREAM:-127.0.0.1:9}
    volumes:
      - live-data:/srv/revenantal-live:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on: [live]

  # The weather service. No domain: only the site calls it, and it trusts only the site,
  # looked up by service name, to name a visitor's address.
  forecast:
    image: ghcr.io/revenantal/revenantal-forecast:${SITE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8090"]
    environment:
      TRUSTED_PEER_HOSTS: site
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The live-data job. No domain. It idles; Coolify's Scheduled Task runs `node /app/main.mjs`
  # in this container every ten minutes, writing /data/live.json for the site to serve.
  live:
    image: ghcr.io/revenantal/revenantal-live:${SITE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    environment:
      PELICAN_URL: ${PELICAN_URL:?}
      PELICAN_KEY: ${PELICAN_KEY:?}
      GAME_QUERY_HOST: ${GAME_QUERY_HOST:-games.revenantal.com}
      STEAM_KEY: ${STEAM_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - live-data:/data
    # Healthy while the shared volume is mounted and writable.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:fs').accessSync('/data', require('node:fs').constants.W_OK)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # live.json and the private rate baselines; only the live job writes here.
  live-data: {}
