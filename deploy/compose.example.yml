services:
  site:
    image: ghcr.io/revenantal/revenantal-site:${SITE_TAG:?Set a verified commit SHA}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose: ["8080"]
    environment:
      # The edge proxy's exact address or range; unset trusts nobody and weather stays off.
      TRUSTED_EDGE: ${TRUSTED_EDGE:-192.0.2.1/32}
      # Set to forecast:8090 only after the 3.7 weather checks pass.
      FORECAST_UPSTREAM: ${FORECAST_UPSTREAM:-127.0.0.1:9}
    networks:
      default: {}
      weather:
        ipv4_address: 172.30.88.2
    volumes:
      - type: bind
        source: /srv/revenantal/live
        target: /srv/revenantal-live
        read_only: true
        bind:
          create_host_path: false

  # Private weather service: no published port, reachable only from the site's Caddy.
  forecast:
    image: ghcr.io/revenantal/revenantal-forecast:${SITE_TAG:?Set a verified commit SHA}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Only the site container's fixed weather-network address may name the visitor.
      TRUSTED_PEERS: 172.30.88.2
    networks:
      weather:
        ipv4_address: 172.30.88.3

networks:
  weather:
    ipam:
      config:
        - subnet: 172.30.88.0/29
