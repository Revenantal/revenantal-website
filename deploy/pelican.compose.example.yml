services:
  pelican-agent:
    image: ghcr.io/revenantal/revenantal-agent:${AGENT_TAG:?Set a verified commit SHA}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./.env.pelican
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: ./pelican-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./pelican-ssh
        target: /run/ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./pelican-config
        target: /run/config
        read_only: true
        bind:
          create_host_path: false
