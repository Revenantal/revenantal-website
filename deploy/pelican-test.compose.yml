# Temporary read-only panel test; uploads are forced off.
services:
  agent:
    image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./.env.pelican
    environment:
      PUSH_ENABLED: "false"
    command: ["node", "/app/main.mjs", "--list"]
    volumes:
      - type: bind
        source: ./app
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
