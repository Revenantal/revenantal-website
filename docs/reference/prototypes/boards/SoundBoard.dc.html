<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound board</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">

    <span style="font-family: 'Michroma', sans-serif; font-size: 28px; letter-spacing: 0.18em">SOUND BOARD</span>

      <sc-for list="{roles}" as="r" hint-placeholder-count="10">
        <button type="button" onClick="{r.play}" style="{r.style}"><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 700">{r.title}</span><span style="color: #9a9aa2; font-size: 12px">{r.src}</span></span><span style="color: #ff3b44">▶</span></button>
      </sc-for>
    </section>
    <section style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 6px; font-size: 13px; letter-spacing: 0.2em; color: #9a9aa2">ALTERNATES</h2>
      <sc-for list="{alts}" as="r" hint-placeholder-count="17">
        <button type="button" onClick="{r.play}" style="{r.style}"><span style="display: flex; gap: 10px; text-align: left"><span style="color: #7a7a82">{r.title}</span><span>{r.src}</span></span><span style="color: #9a9aa2">▶</span></button>
      </sc-for>
    </section>
  </div>
</div>
