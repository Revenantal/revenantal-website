<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Guide B · Teletext</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes tt-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.tt-row{display:flex;justify-content:space-between;height:30px;align-items:center}
.tt-dots{flex:1;margin:0 8px;border-bottom:3px dotted #00ffff;transform:translateY(-6px)}
</style>
</helmet>
<div style="position: relative; width: 760px; height: 570px; overflow: hidden; background: #000; font-family: 'VT323', monospace; font-size: 28px; color: #fff; padding: 16px 26px; box-sizing: border-box; line-height: 1">
  <!-- page header line -->
  <div style="display: flex; justify-content: space-between; color: #fff; font-size: 26px"><span>P101</span><span style="color: #00ff00">REVTEXT</span><span>101</span><span style="color: #ffff00">Sun 18 Oct</span><span style="color: #ffff00">19:42:07</span></div>

  <!-- double-height masthead with mosaic blocks -->
  <div style="display: flex; align-items: center; gap: 14px; margin: 12px 0 10px; padding: 8px 12px; background: #0000ff">
    <div style="display: grid; grid-template-columns: repeat(4, 14px); grid-auto-rows: 14px; gap: 2px">
      <span style="background: #ff0000"></span><span style="background: #ff0000"></span><span></span><span style="background: #ff0000"></span>
      <span style="background: #ff0000"></span><span></span><span style="background: #ff0000"></span><span></span>
      <span style="background: #ff0000"></span><span style="background: #ff0000"></span><span></span><span style="background: #ff0000"></span>
    </div>
    <div style="font-size: 56px; color: #ffff00; transform: scaleY(1.15); letter-spacing: 2px">REVENANTAL</div>
    <div style="margin-left: auto; text-align: right; color: #00ffff; font-size: 24px; line-height: 1.05">PROJECTS<br>&amp; SERVERS</div>
  </div>

  <div style="color: #00ffff; margin-bottom: 6px">ON AIR NOW ......................</div>
  <div class="tt-row"><span style="color: #fff">Project A</span><span class="tt-dots"></span><span style="color: #ffff00">201</span></div>
  <div class="tt-row"><span style="color: #fff">Project B <span style="color: #ff00ff">NEW</span></span><span class="tt-dots"></span><span style="color: #ffff00">202</span></div>
  <div class="tt-row"><span style="color: #fff">Project C</span><span class="tt-dots"></span><span style="color: #ffff00">203</span></div>
  <div class="tt-row"><span style="color: #fff">Project D</span><span class="tt-dots"></span><span style="color: #ffff00">204</span></div>
  <div class="tt-row"><span style="color: #fff">Project E</span><span class="tt-dots"></span><span style="color: #ffff00">205</span></div>
  <div class="tt-row"><span style="color: #00ff00">Game servers: 4 up</span><span class="tt-dots"></span><span style="color: #ffff00">300</span></div>
  <div class="tt-row"><span style="color: #00ff00">Now playing on Steam</span><span class="tt-dots"></span><span style="color: #ffff00">400</span></div>
  <div class="tt-row"><span style="color: #00ff00">Recent GitHub pushes</span><span class="tt-dots"></span><span style="color: #ffff00">500</span></div>

  <div style="margin-top: 14px; padding: 4px 8px; background: #ff0000; color: #ffff00">NEWSFLASH <span style="color: #fff">Project B added this week</span> <span style="animation: tt-blink 1s steps(1) infinite">█</span></div>

  <!-- fastext bar -->
  <div style="position: absolute; left: 26px; right: 26px; bottom: 16px; display: grid; grid-template-columns: repeat(4, 1fr); font-size: 26px">
    <span style="color: #ff0000">Projects</span><span style="color: #00ff00">Servers</span><span style="color: #ffff00">Steam</span><span style="color: #00ffff">Index</span>
  </div>
</div>
</x-dc>
</body>
</html>
