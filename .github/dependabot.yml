version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types track the Node 24 runtime (engines, Docker image, CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /docs/reference/prototypes
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/, /jobs/live]
    schedule:
      interval: weekly
    ignore:
      # The live job stays on the Node 24 runtime until it moves deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
