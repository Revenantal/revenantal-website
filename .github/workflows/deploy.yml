name: Publish site

on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/revenantal/revenantal-site
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm this is still the production head
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.candidate.outputs.current == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.candidate.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.candidate.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.candidate.outputs.current == 'true'
        run: pnpm build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.candidate.outputs.current == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.candidate.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.candidate.outputs.current == 'true'
        with:
          context: .
          push: true
          # One plain manifest per image, so each publish is one package version.
          provenance: false
          sbom: false
          tags: ghcr.io/revenantal/revenantal-site:${{ env.TESTED_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.candidate.outputs.current == 'true'
        with:
          context: .
          file: jobs/live/Dockerfile
          push: true
          # One plain manifest per image, so each publish is one package version.
          provenance: false
          sbom: false
          tags: ghcr.io/revenantal/revenantal-live:${{ env.TESTED_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
      - name: Fetch the DB-IP Lite city database for the weather service
        if: steps.candidate.outputs.current == 'true'
        run: pnpm fetch:dbip
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.candidate.outputs.current == 'true'
        with:
          context: .
          file: api/forecast/Dockerfile
          push: true
          # One plain manifest per image, so each publish is one package version.
          provenance: false
          sbom: false
          tags: ghcr.io/revenantal/revenantal-forecast:${{ env.TESTED_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
      - name: Promote the current tested image
        if: steps.candidate.outputs.current == 'true'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$TESTED_SHA" ]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE:$TESTED_SHA"
            docker buildx imagetools create --prefer-index=false --tag "ghcr.io/revenantal/revenantal-live:latest" "ghcr.io/revenantal/revenantal-live:$TESTED_SHA"
            docker buildx imagetools create --prefer-index=false --tag "ghcr.io/revenantal/revenantal-forecast:latest" "ghcr.io/revenantal/revenantal-forecast:$TESTED_SHA"
            echo 'promoted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request the configured Coolify deployment
        if: steps.promotion.outputs.promoted == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Until Coolify is connected, publish without asking it to deploy.
          if [ -z "$COOLIFY_WEBHOOK" ] && [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Images published; no Coolify secrets yet, so no deploy was requested."
            exit 0
          fi
          test -n "$COOLIFY_TOKEN"
          case "$COOLIFY_WEBHOOK" in https://*) ;; *) exit 1 ;; esac
          # Show the start of Coolify's reply: what it queued, or why it refused (never a secret).
          status=$(curl --request POST --silent --show-error --max-time 30 --output reply.txt \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          case "$status" in
            2??)
              echo "::notice::Coolify: $(head -c 300 reply.txt | tr -d '\r\n')"
              ;;
            *)
              echo "::error::Coolify answered $status: $(head -c 300 reply.txt | tr -d '\r\n')"
              exit 1
              ;;
          esac
      - name: Keep only the current image and one rollback
        if: steps.promotion.outputs.promoted == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/deploy/prune-images.ts
