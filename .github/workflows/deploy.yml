name: Publish site

on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/revenantal/revenantal-site
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm this is still the production head
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.candidate.outputs.current == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.candidate.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.candidate.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.candidate.outputs.current == 'true'
        run: pnpm build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.candidate.outputs.current == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.candidate.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.candidate.outputs.current == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/revenantal/revenantal-site:${{ env.TESTED_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.candidate.outputs.current == 'true'
        with:
          context: .
          file: jobs/live/Dockerfile
          push: true
          tags: ghcr.io/revenantal/revenantal-live:${{ env.TESTED_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TESTED_SHA }}
      - name: Promote the current tested image
        if: steps.candidate.outputs.current == 'true'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$TESTED_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TESTED_SHA"
            docker buildx imagetools create --tag "ghcr.io/revenantal/revenantal-live:latest" "ghcr.io/revenantal/revenantal-live:$TESTED_SHA"
            echo 'promoted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request the configured Coolify deployment
        if: steps.promotion.outputs.promoted == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_TOKEN"
          case "$COOLIFY_WEBHOOK" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
